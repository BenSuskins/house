name: Checks and image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: house-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-assets.mjs
      - run: node scripts/check-server.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: house:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node scripts/check-container.mjs house:ci
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOUSE_IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag house:ci ghcr.io/bensuskins/house:latest
          docker tag house:ci "ghcr.io/bensuskins/house:$HOUSE_IMAGE_TAG"
          docker push ghcr.io/bensuskins/house:latest
          docker push "ghcr.io/bensuskins/house:$HOUSE_IMAGE_TAG"
